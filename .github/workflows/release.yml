name: Publish release

on:
  push:
    branches: [master, release/v1, dev/v2]
    paths: [.github/release.json]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release target
    if: contains(fromJSON('["refs/heads/master", "refs/heads/release/v1", "refs/heads/dev/v2"]'), github.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
      target: ${{ steps.config.outputs.target }}
      module_dir: ${{ steps.config.outputs.module_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate configuration, ancestry, module path and version
        id: config
        run: python3 -B .github/scripts/prepare_release.py

  checks:
    name: Validate release commit
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.prepare.outputs.target }}
      release_module: ${{ needs.prepare.outputs.module_dir }}

  release:
    name: Publish validated release
    needs: [prepare, checks]
    if: needs.prepare.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish pinned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
        run: python3 -B .github/scripts/publish_release.py
